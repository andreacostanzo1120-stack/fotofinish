name: Build IPA

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Installa XcodeGen
        run: brew install xcodegen

      - name: Genera il progetto Xcode
        run: xcodegen generate

      - name: Compila senza firma
        run: |
          set -o pipefail
          xcodebuild \
            -project FotoFinish.xcodeproj \
            -scheme FotoFinish \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" \
            2>&1 | tee build.log

      - name: Crea il file IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/FotoFinish.app Payload/
          zip -qry FotoFinish.ipa Payload

      - name: Carica l'IPA
        uses: actions/upload-artifact@v4
        with:
          name: FotoFinish-ipa
          path: FotoFinish.ipa

      - name: Riepilogo errori
        if: failure()
        run: |
          echo '### Errori di compilazione' >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          grep -E "error:|fatal error|Error:" build.log | head -40 >> "$GITHUB_STEP_SUMMARY" || true
          echo '```' >> "$GITHUB_STEP_SUMMARY"

      - name: Carica il log completo
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
